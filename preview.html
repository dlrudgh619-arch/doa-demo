<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>현장대장 체험판 — 화면 미리보기</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--primary:#3182F6;--primary-weak:#E8F3FF;--bg:#F2F4F6;--text:#191F28;--text2:#8B95A1;--border:#E5E8EB}
body{font-family:'Pretendard Variable',Pretendard,-apple-system,'Malgun Gothic',sans-serif;
  background:var(--bg);color:var(--text);letter-spacing:-.02em;min-height:100vh;display:flex;flex-direction:column}

/* ── 상단 바 ── */
.bar{background:#fff;border-bottom:1px solid var(--border);padding:14px 24px;display:flex;
  align-items:center;gap:16px;flex-wrap:wrap;flex-shrink:0}
.bar h1{font-size:19px;font-weight:700;letter-spacing:-.03em}
.bar .tag{font-size:11px;font-weight:800;background:#FF9500;color:#fff;padding:4px 9px;border-radius:8px;letter-spacing:.5px}
.segs{display:flex;gap:4px;background:var(--bg);padding:4px;border-radius:12px;margin-left:auto}
.segs button{border:none;background:none;font-family:inherit;font-size:14px;font-weight:600;color:var(--text2);
  padding:8px 16px;border-radius:9px;cursor:pointer;letter-spacing:-.02em}
.segs button.on{background:#fff;color:var(--primary);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.open{font-size:14px;font-weight:600;color:var(--text2);text-decoration:none;padding:8px 14px;border-radius:10px}
.open:hover{background:var(--bg);color:var(--text)}

/* ── 안내 ── */
.note{background:#FFF4E0;color:#C77700;font-size:13px;line-height:1.6;padding:11px 24px;flex-shrink:0}
.note b{font-weight:700}

/* ── 무대 ── */
.stage{flex:1;min-height:0;display:flex;gap:28px;justify-content:center;align-items:flex-start;
  padding:24px;overflow:auto}
.pane{display:none;flex-direction:column;align-items:center;gap:10px}
.pane.show{display:flex}
.cap{font-size:13px;font-weight:600;color:var(--text2)}

/* 휴대폰 액자 */
.bezel{background:#191F28;border-radius:44px;padding:12px;box-shadow:0 18px 50px rgba(0,0,0,.18);
  transform-origin:top center}
.bezel iframe{width:390px;height:844px;border:none;border-radius:32px;display:block;background:#fff}

/* PC 화면 — 1280px 로 그린 뒤 자리에 맞게 줄인다 */
.deskbox{border-radius:14px;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.14);background:#fff}
.deskscale{transform-origin:top left}
.deskscale iframe{width:1280px;height:820px;border:none;display:block;background:#fff}

@media (max-width:820px){
  .stage{padding:16px}
  .segs{margin-left:0;width:100%;justify-content:center}
  .bar{justify-content:center}
}
</style>
</head>
<body>

<div class="bar">
  <h1>현장대장</h1><span class="tag">체험판</span>
  <div class="segs" id="segs">
    <button data-m="mobile" class="on">휴대폰</button>
    <button data-m="pc">PC</button>
    <button data-m="both">나란히</button>
  </div>
  <a class="open" href="./index.html" target="_blank" rel="noopener">새 창에서 열기 ↗</a>
</div>

<div class="note">
  실제 운영 데이터와 <b>완전히 분리된 체험용 서버</b>입니다. 무엇을 등록·수정·삭제해도 안전합니다.
  모든 팀원 비밀번호는 <b>1111</b>, 대표 권한은 <b>김대표</b>로 로그인하세요.
  여러 분이 함께 보는 체험판이라 <b>다른 분이 넣은 자료가 같이 보일 수 있습니다.</b>
</div>

<div class="stage" id="stage">
  <div class="pane show" id="paneM">
    <div class="cap">휴대폰 화면</div>
    <div class="bezel" id="bezel"><iframe id="fM" src="./index.html" title="휴대폰 화면"></iframe></div>
  </div>
  <div class="pane" id="paneP">
    <div class="cap">PC 화면</div>
    <div class="deskbox" id="deskbox"><div class="deskscale" id="deskscale"><iframe id="fP" src="./index.html" title="PC 화면"></iframe></div></div>
  </div>
</div>

<script>
// 휴대폰은 390×844, PC는 1280×820 으로 그린 뒤 남는 자리에 맞춰 줄인다.
// 이렇게 해야 앱 안의 반응형 기준(1024px)이 실제 기기와 똑같이 동작한다.
const PHONE_W=390, PHONE_H=844, BEZEL=12
const DESK_W=1280, DESK_H=820
const stage=document.getElementById('stage')
const paneM=document.getElementById('paneM'), paneP=document.getElementById('paneP')
const bezel=document.getElementById('bezel')
const deskbox=document.getElementById('deskbox'), deskscale=document.getElementById('deskscale')
let mode='mobile'

const clamp=(v,lo,hi)=>Math.max(lo,Math.min(hi,v))

function fit(){
  // 첫 렌더링 등 무대 크기가 아직 안 잡혔을 때 엉뚱한 배율이 나오지 않게 막는다
  const sw=stage.clientWidth, sh=stage.clientHeight
  if(sw<200||sh<200){requestAnimationFrame(fit);return}

  const showM=paneM.classList.contains('show'), showP=paneP.classList.contains('show')
  const pad=48, gap=28, capH=46
  const availH=Math.max(300, sh-capH)
  let availW=Math.max(300, sw-pad)

  const phoneOuterW=PHONE_W+BEZEL*2, phoneOuterH=PHONE_H+BEZEL*2
  let phoneShare=availW
  if(showM&&showP){phoneShare=Math.min(phoneOuterW, availW*0.34); availW=Math.max(300, availW-phoneShare-gap)}

  const kM=clamp(Math.min(availH/phoneOuterH, phoneShare/phoneOuterW), .2, 1)
  bezel.style.transform=`scale(${kM})`
  paneM.style.width=(phoneOuterW*kM)+'px'
  paneM.style.height=(phoneOuterH*kM+capH)+'px'

  // PC 는 항상 1280 폭으로 그린 뒤 남은 자리에 맞춰 축소한다.
  // 그래야 아이프레임 안에서 앱의 1024px 반응형 기준이 실제 PC 와 똑같이 걸린다.
  const kP=clamp(Math.min(availW/DESK_W, availH/DESK_H), .2, 1)
  deskscale.style.transform=`scale(${kP})`
  deskbox.style.width=(DESK_W*kP)+'px'
  deskbox.style.height=(DESK_H*kP)+'px'
  paneP.style.width=(DESK_W*kP)+'px'
}

function setMode(m){
  mode=m
  paneM.classList.toggle('show', m==='mobile'||m==='both')
  paneP.classList.toggle('show', m==='pc'||m==='both')
  document.querySelectorAll('#segs button').forEach(b=>b.classList.toggle('on', b.dataset.m===m))
  fit()
}
document.getElementById('segs').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(b)setMode(b.dataset.m)
})
addEventListener('resize',fit)
addEventListener('load',fit)
// 무대 크기는 창 크기로만 정해지므로(자식이 키우지 않는다) 관찰해도 순환하지 않는다
let lastW=0,lastH=0
new ResizeObserver(()=>{
  const sw=stage.clientWidth, sh=stage.clientHeight
  if(Math.abs(sw-lastW)<2&&Math.abs(sh-lastH)<2)return
  lastW=sw;lastH=sh;fit()
}).observe(stage)
setMode('mobile')
</script>
</body>
</html>
